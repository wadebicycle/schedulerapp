<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Green background -->
  <rect width="64" height="64" rx="12" fill="#107C41"/>

  <!-- === BOOK (horizontal crossbar of T) === -->
  <!-- Left page -->
  <rect x="4" y="11" width="25" height="15" rx="2" fill="white"/>
  <!-- Right page -->
  <rect x="35" y="11" width="25" height="15" rx="2" fill="white"/>
  <!-- Spine binding -->
  <rect x="28" y="9" width="8" height="19" rx="3" fill="white"/>

  <!-- Left page text lines -->
  <line x1="8"  y1="17" x2="25" y2="17" stroke="#107C41" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <line x1="8"  y1="21" x2="25" y2="21" stroke="#107C41" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <!-- Right page text lines -->
  <line x1="39" y1="17" x2="56" y2="17" stroke="#107C41" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <line x1="39" y1="21" x2="56" y2="21" stroke="#107C41" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>

  <!-- === CONNECTOR (stem of T joining book to clock) === -->
  <rect x="30" y="28" width="4" height="7" fill="white"/>

  <!-- === CLOCK (vertical stem of T) === -->
  <circle cx="32" cy="47" r="14" fill="white"/>
  <!-- Clock tick marks (12, 3, 6, 9) -->
  <line x1="32" y1="34.5" x2="32" y2="36.5" stroke="#107C41" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44.5" y1="47" x2="42.5" y2="47" stroke="#107C41" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="59.5" x2="32" y2="57.5" stroke="#107C41" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19.5" y1="47" x2="21.5" y2="47" stroke="#107C41" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hour hand (pointing to ~10) -->
  <line x1="32" y1="47" x2="26.5" y2="40.5" stroke="#107C41" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (pointing to 12) -->
  <line x1="32" y1="47" x2="32" y2="38" stroke="#107C41" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="47" r="2" fill="#107C41"/>
</svg>
